name: Gold Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Gold-only source guard
        run: |
          ! grep -RniE 'BTCUSDT|ETHUSDT|XRPUSDT|LINKUSDT|AAVE|SOLUSDT|AVAXUSDT|BNBUSDT' --include='*.py' .
