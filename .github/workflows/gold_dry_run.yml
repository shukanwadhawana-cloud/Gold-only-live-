name: Gold-only CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q

# This repository workflow is CI/preflight only. The continuous Gold worker
# must run in a persistent worker environment, not as an unbounded
# GitHub-hosted job. GitHub-hosted jobs have a 6-hour execution limit.
