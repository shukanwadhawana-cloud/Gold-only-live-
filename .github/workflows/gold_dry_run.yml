name: Gold-only dry-run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: gold-only-dry-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Gold strategy in DRY RUN
        env:
          LIVE_TRADING: 'false'
        run: python main.py
      - name: Commit state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add gold_state.json || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Update Gold dry-run state [skip ci]'
          git push
